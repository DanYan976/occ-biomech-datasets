id: wang-roofing-pose-estimation
title: "Video-Based 3D Pose Estimation for Residential Roofing"
sample: false
category: vision

source:
  authors: "Wang R., Zheng L., Hawke A.L., Carey R.E., Breloff S.P., Li K., Peng X."
  institution: "NIOSH / University of Delaware"
  year: 2022

links:
  paper: "https://doi.org/10.1080/21681163.2022.2072394"
  doi: "10.1080/21681163.2022.2072394"
