domain: "Residential roofing (construction)"
inputs: "RGB video of roofing work"
outputs: "3D human pose (joint positions)"
tags: [pose-estimation, markerless, roofing, construction, deep-learning]
description: >
  NIOSH-University of Delaware method for estimating 3D worker pose directly
  from video of residential roofing tasks (Comput. Methods Biomech. Biomed.
  Eng.: Imaging & Visualization, 2022), a step toward markerless ergonomic
  exposure assessment on job sites where marker-based motion capture is
  impractical. Public as a paper and NIOSH record; no code release.
