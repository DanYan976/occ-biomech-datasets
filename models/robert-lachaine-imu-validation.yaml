id: robert-lachaine-imu-validation
title: "Full-Body IMU Joint Angle Validation for Manual Material Handling"
sample: false
category: wearable

source:
  authors: "Robert-Lachaine X., Mecheri H., Larue C., Plamondon A."
  institution: "IRSST (Montreal) / Ecole de technologie superieure"
  year: 2017

links:
  paper: "https://doi.org/10.1007/s11517-016-1537-2"
