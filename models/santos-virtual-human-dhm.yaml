tags: [digital-human-modeling, predictive-simulation, optimization, strength, fatigue, commercial]
description: >
  Physics- and optimization-based predictive digital human developed at the
  University of Iowa Virtual Soldier Research program: predicts posture,
  motion, strength, reach, discomfort, and joint loads from task descriptions
  rather than prerecorded motion. The linked chapter (DHM 2025 symposium)
  is a recent application evaluating the U.S. Army Combat Fitness Test
  biomechanically with Santos. Commercially available through SantosHuman
  Inc.; research versions at the Iowa Technology Institute.
