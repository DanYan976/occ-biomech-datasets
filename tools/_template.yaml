# Copy this file to a new name (e.g. tools/my-tool.yaml) and fill it in.
# Files starting with "_" are ignored by the build. See schema/tool.schema.json
# for the full field list. Required: id, title, vendor, links (at least one URL).

id: my-tool                           # lowercase-hyphenated slug, same as the filename
title: "Human-readable tool name"
sample: false

vendor: "Company or organization that distributes the tool"
source:                               # who developed it, when known (often a lab behind the product)
  authors: "Last F., Last F., et al."
  institution: "Lab / University"
  year: 2025

links:                                # at least one; website is the vendor's product page
  website: "https://example.com/product"
  # docs: "https://example.com/docs"
  # paper: "https://doi.org/10.xxxx/xxxxx"
  # doi: "10.xxxx/xxxxx"
  # record: "https://lab.university.edu/tool"

licensing: commercial                 # commercial | free | open_source
pricing_note: "One line on terms, e.g. 'academic license available'"
category: "What kind of tool, e.g. video task analysis"
inputs: "What the tool consumes, e.g. conventional workplace video"
outputs: "What the tool produces, e.g. time-study reports, duty cycle"
# patents:                            # when known
#   - number: "US 0,000,000"
#     title: "Patent title"
#     url: "https://patents.google.com/patent/US0000000B1/en"
related_models: []                    # ids of Models-library entries it implements or builds on
related_datasets: []                  # ids of catalog datasets collected or analyzed with it
tags: [computer-vision, ergonomics]
description: >
  One or two sentences: what the tool does, who makes it, and how it is
  obtained. Keep it under ~600 characters.
added: 2025-01-01
