description: >
  Video task analysis software developed by Radwin and Yen at UW-Madison and
  distributed commercially by NexGen Ergonomics: analysts mark event
  breakpoints in video played at any speed or direction, and MVTA computes
  time studies, event frequencies, duty cycles and postural analyses. With its
  companion single-frame duty-cycle tool (SVDA) it supplied the duty-cycle
  measurements behind the frequency- and hand-speed-based ACGIH HAL equations.
