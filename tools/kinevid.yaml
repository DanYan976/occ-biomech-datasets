description: >
  UW-Madison spin-off commercializing Radwin's computer-vision exposure
  assessment: automatic ACGIH hand activity level from tracked hand motion in
  ordinary video, and a single-camera monitor that extracts lifting risk
  parameters aligned with the NIOSH lifting equation. Both are patent-protected
  (US 9,566,004 assigned to KineVid; US 11,450,148 assigned to WARF) and build
  on the hand speed-duty cycle HAL equation.
