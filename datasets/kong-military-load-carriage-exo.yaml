publications:
  - citation: "Kong P.W., Koh A.H., Ho M.Y.M., Iskandar M.N.S., Lim C.X.E. (2024). Effectiveness of a passive military exoskeleton in off-loading weight during static and dynamic load carriage: A randomised cross-over study. Appl. Ergon. 119:104293"
