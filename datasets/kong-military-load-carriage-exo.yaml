tags: [exoskeleton, load-carriage, military, in-shoe-grf, walking]
description: >
  Randomized crossover study of a passive military load-carriage
  exoskeleton in 8 Singapore Armed Forces personnel: in-shoe ground
  reaction forces during static standing under 0-55 kg loads and treadmill
  walking (flat/incline/decline, 25/35 kg), with and without the device
  (Applied Ergonomics, 2024). The NIE Data Repository deposit
  (CC BY-NC 4.0) contains processed summary tables, not raw GRF time
  series.
