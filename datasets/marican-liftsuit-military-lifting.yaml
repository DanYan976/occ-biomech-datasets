  outcomes: [muscle_activity]

publications:
  - citation: "Marican M.A., Chandra L.D., Tang Y., Iskandar M.N.S., Lim C.X.E., Kong P.W. (2025). Biomechanical Effects of a Passive Back-Support Exosuit During Simulated Military Lifting Tasks - An EMG Study. Sensors 25(10):3211"
    doi: "10.3390/s25103211"

load: "15/25 kg vertical lifts to 0.5 m and 1.2 m; lateral carry of 39 kg in a simulated confined vehicle space"
