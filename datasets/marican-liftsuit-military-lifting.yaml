status: open
sample: false

source:
  authors: "Marican M.A., Chandra L.D., Tang Y., Iskandar M.N.S., Lim C.X.E., Kong P.W."
  institution: "National Institute of Education, Nanyang Technological University"
  country: [SG]
  year: 2025

access:
  url: "https://researchdata.nie.edu.sg/dataset.xhtml?persistentId=doi:10.25340/R4/MHOS3X"
  doi: "10.25340/R4/MHOS3X"
