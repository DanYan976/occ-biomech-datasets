sampling:
  emg: 1500
  video: 30
tags: [exoskeleton, back, exosuit, military, lifting, semg]
description: >
  Crossover EMG study of the Auxivo LiftSuit 2.0 passive back-support
  exosuit in 10 male military personnel performing 15/25 kg lifts and a
  39 kg confined-space carry (Sensors, 2025). The NIE Data Repository
  deposit (CC BY-NC 4.0) holds aggregated back-extensor muscle-activity
  outcomes with and without the exosuit - processed summary data, not raw
  EMG signals.
