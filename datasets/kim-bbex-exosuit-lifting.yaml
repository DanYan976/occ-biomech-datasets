description: >
  Motion capture, surface EMG and OpenSim simulation data from 11 male
  participants lifting a 5.5 kg weight symmetrically and asymmetrically with
  and without the BBEX active bilateral back extensor exosuit (Science
  Robotics, 2024). The 2.5 GB Dryad deposit (CC0) includes marker
  trajectories, musculoskeletal models, external-load files, lumbar joint
  loading results and the R statistics code.
