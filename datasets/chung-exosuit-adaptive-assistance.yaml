description: >
  Evaluation of adaptive back-exosuit assistance that scales to box weight,
  including a camera/ML-based weight-detection controller: 15 + 6
  participants transferred 2/8/14 kg boxes (9,600 lifts) while EMG, IMU,
  mocap, force-plate and perceptual data were recorded (Scientific Reports,
  2025). Datasets and code available from the corresponding author upon
  reasonable request.
