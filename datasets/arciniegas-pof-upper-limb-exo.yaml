description: >
  Evaluation data for polymer-optical-fiber vs. IMU sensing in an
  impedance-controlled upper-limb industrial exoskeleton: arm kinematics,
  surface EMG and control-loop signals from 3 subjects performing lifting,
  carrying and lowering tasks assisted and unassisted, plus test-bench
  step/chirp response trials. 38 raw CSV files on figshare (CC BY 4.0)
  accompanying a Scientific Reports 2026 paper.
