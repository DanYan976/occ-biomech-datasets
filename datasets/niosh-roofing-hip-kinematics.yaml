tags: [roofing, construction, marker-set, methods, hip]
description: >
  Methods dataset comparing hip kinematics from two pelvis tracking-marker
  configurations (trochanter-based TTM vs. virtual-marker VPTM, CODA pelvis)
  while 7 participants mimicked standing and kneeling roofing tasks. Useful
  for marker-set selection and occlusion-robust pelvis tracking in
  occupational motion capture. Public-domain NIOSH research dataset
  RD-1062-2023-0 on CDC STACKS.
