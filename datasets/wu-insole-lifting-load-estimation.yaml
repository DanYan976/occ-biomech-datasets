tags: [pressure-insoles, load-estimation, exoskeleton-control, lifting, machine-learning]
description: >
  Announced dataset of raw 36-channel insole plantar-pressure recordings
  from 5 subjects lifting 2-10 kg loads, collected to train lifting-load
  regression models for adaptive control of industrial lifting exoskeletons
  (IEEE AIRC 2026; arXiv 2503.07527). The paper states data and code are
  public on GitHub, but the linked repository is still empty as of
  September 2026 - listed as coming soon until the deposit is populated.
