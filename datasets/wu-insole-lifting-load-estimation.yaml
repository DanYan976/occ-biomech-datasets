id: wu-insole-lifting-load-estimation
title: "Insole Plantar-Pressure Data for Lifting-Load Estimation (FIU)"
status: coming_soon
sample: false

source:
  authors: "Wu K., Xiang P., Lin C., Bai O."
  institution: "Florida International University"
  country: [US]
