load: "Manual order picking at a Dagrofa Logistik warehouse (Vejle, Denmark): heavy lifting, awkward postures, repetitive movements at production pace"
equipment: "Questionnaires (perceived work intensity, Cornell Musculoskeletal Discomfort), company registers (sickness absence, turnover, productivity), exoskeleton usage logs, focus-group interviews, cost-effectiveness analysis"
tags: [exoskeleton, back, field-study, warehouse, intervention, protocol]
description: >
  Protocol of the RELAX project: an 18-month controlled (non-randomized)
  in-field intervention at a Danish warehouse, comparing a department of
  ~45 order pickers using the SUITX IX Back Air passive back exoskeleton
  against a usual-work control department. Outcomes cover perceived work
  intensity, musculoskeletal discomfort, absence, turnover, productivity
  and cost-effectiveness. Results pending (trial runs through 2029); data
  will be available from the authors on reasonable request.
