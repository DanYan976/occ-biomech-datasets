description: >
  Anonymized focus-group transcripts from 14 operating-room team members
  (7 surgical residents, 4 nurses, 3 attending surgeons) on the needs and
  barriers for exoskeleton use in surgery, collected after a simulated
  surgical task wearing a commercial upper-body exoskeleton. Qualitative
  data only, public domain (CC0) on the Purdue University Research
  Repository; supports the Human Factors 2020 adoption study.
