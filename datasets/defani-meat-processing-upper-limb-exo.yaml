description: >
  Field study of a passive upper-limb exoskeleton worn by 17 workers on a
  Brazilian meat-processing production line: processed surface-EMG and
  subjective workload data with vs. without the device, reporting a
  significant activity reduction in the right medial deltoid and
  medium-to-large effect sizes across several muscles. One of very few
  open-data field studies of occupational exoskeletons; distributed as a
  single Excel workbook on Zenodo (CC BY 4.0).
