tags: [roofing, construction, kneeling, knee, intervention]
description: >
  Phase-level assessment of interventions against knee musculoskeletal
  disorder risk in roofing: 9 participants installed shingles on a
  slope-adjustable roof platform (0, 15, 30 deg) with no intervention, knee
  pads, knee savers, or both. Knee flexion, ab/adduction and rotation angles
  were captured across seven task phases, from reaching for shingles to
  returning upright. Public-domain NIOSH research dataset RD-1108-2025-0 on
  CDC STACKS.
