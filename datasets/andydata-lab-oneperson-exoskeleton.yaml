  outcomes: [muscle_activity, kinematics, kinetics, metabolic, cardiovascular, subjective]

load: "Overhead pointing task, with vs. without the Paexo Shoulder passive exoskeleton"
equipment: "Whole-body mocap, force plates, shoulder & back EMG, oxygen consumption, heart rate; Paexo Shoulder (Ottobock)"
formats: [mat, csv, mp4]
tags: [exoskeleton, shoulder, overhead-work, paexo, ergonomics]
description: >
  Whole-body kinematics, ground reaction forces, shoulder/back EMG, oxygen
  consumption, heart rate and subjective workload from 12 participants doing
  overhead pointing with and without the Paexo Shoulder passive exoskeleton.
  Used as input by Fritzsche et al. (2021) for AnyBody simulation of overhead
  drilling, showing 54-87% deltoid activity reduction.
