  authors: "Maurice P., Camernik J., Gorjan D., Babic J., Schirrmeister B., Bornmann J., Ivaldi S., Tagliapietra L., Latella C., Pucci D."
  institution: "Inria / Jozef Stefan Institute (AnDy project)"
  year: 2018

