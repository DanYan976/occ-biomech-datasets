id: moulart-japet-lumbar-traction
title: "Japet.W Active Lumbar Traction Exoskeleton: Kinematics and EMG in Manual Handling"
status: restricted
sample: false

source:
  authors: "Moulart M., Acien M., Leonard A., Loir M., Olivier N., Marin F."
  institution: "Université de Technologie de Compiègne / Japet Medical Devices"
  country: [FR]
  year: 2024

access:
  url: "https://doi.org/10.3390/biomechanics4020025"
  license: "On request from corresponding author (privacy-restricted)"

tasks: [lifting, carrying, squatting]
setting: lab
modalities: [mocap, emg]

subjects:
  n: 23
  sex: "14F / 9M"
  age_range: "20.2 ± 1.2"

exoskeleton:
  role: evaluation
  devices: ["Japet.W (Japet)", "Japet.W passive belt (Japet)"]
  body_region: [back]
