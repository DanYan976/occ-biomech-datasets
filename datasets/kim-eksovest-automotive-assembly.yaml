description: >
  18-month controlled field study of a passive arm-support exoskeleton
  (EksoVest) worn during overhead assembly work at nine Ford automotive
  plants, with matched controls. Repeated questionnaires captured perceived
  work intensity, discomfort, usability and acceptance; plant medical-visit
  records tracked health outcomes. Exoskeleton use reduced perceived shoulder
  demands and may lower medical-visit likelihood. One cohort, two reports —
  see Publications. Data shared on request.
