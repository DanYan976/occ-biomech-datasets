tags: [exoskeleton, neck, back, sustained-posture, endurance, semg]
description: >
  Evaluation of the NekSpine passive neck + lower-back exoskeleton during
  sustained downward-gaze work: 10 participants (5M/5F) performed a
  simulated sorting task at 15-60° neck flexion and an endurance hold with
  and without the device while bilateral neck/back EMG and perceived
  exertion were recorded (Sensors, 2026). One of the few neck-support
  records in the catalog; data available upon request.
