description: >
  Multimodal wearable data - a chest-mounted soft biosensor (ECG-derived heart
  rate, HRV, skin temperature) plus five torso/arm IMUs - with self-reported
  Borg ratings from 43 workers performing composite layup and wire-harnessing
  tasks with a weighted vest to induce fatigue, across five work segments plus
  rest, for multi-level fatigue prediction (PNAS Nexus, 2024).
