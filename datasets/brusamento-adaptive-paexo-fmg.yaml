publications:
  - citation: "Sierotowicz M., Brusamento D., Schirrmeister B., Connan M., Bornmann J., Gonzalez-Vargas J., Castellini C. (2022). Unobtrusive, natural support control of an adaptive industrial exoskeleton using force myography. Front. Robot. AI 9:919370"
