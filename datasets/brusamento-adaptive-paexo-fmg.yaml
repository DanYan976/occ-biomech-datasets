description: >
  Force-myography recordings from 12 subjects wearing the adaptive (active)
  variant of the Ottobock Paexo Shoulder while performing lifting sequences
  with varied weights, collected at DLR to develop regression-based intent
  detection for automatic support-level adaptation. CSV sensor data plus
  privacy-protected video on Zenodo (EU H2020 An.Dy project); access
  requires DLR approval.
