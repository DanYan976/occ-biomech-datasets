load: "Metronome-paced stoop lifting of unknown 5 kg and 15 kg box loads"
equipment: "8-channel Ottobock 13E400 EMG, 9 Xsens MVN Link IMUs, 12-camera Qualisys mocap (33 markers), cable load cells; off-board cable-driven actuation"
tags: [exoskeleton, back, exosuit, neuromusculoskeletal-model, adaptive-control, lifting]
description: >
  Evaluation of a University of Twente soft active back exosuit whose
  assistance is set in real time by an EMG-driven musculoskeletal model
  (NMBC): 10 participants stoop-lifted unknown 5 and 15 kg loads while
  EMG, IMU and optical mocap data were recorded, showing adaptive
  assistance and reduced lumbosacral compression (Wearable Technologies,
  2025). Data by email to the corresponding author on reasonable request.
