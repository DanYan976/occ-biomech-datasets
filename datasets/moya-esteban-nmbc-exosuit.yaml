publications:
  - citation: "Moya-Esteban A., Mohamed Refai M.I., Sridar S., van der Kooij H., Sartori M. (2025). Soft back exosuit controlled by neuro-mechanical modeling provides adaptive assistance while lifting unknown loads and reduces lumbosacral compression forces. Wearable Technol. 6:e9"
