description: >
  Multimodal dataset from 21 adults performing construction-like tasks
  (stair and ramp ascent/descent, kneeling, VR precision work) on a modular
  stair-ramp-deck platform, with and without powered knee exoskeleton
  assistance, in a randomized crossover design. Synchronized motion capture,
  force plate, sEMG, IMU and metabolic recordings in a single 3.75 GB MATLAB
  file on Mendeley Data (CC BY 4.0).
