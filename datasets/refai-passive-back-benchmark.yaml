tags: [exoskeleton, back, benchmark, passive-exoskeleton, comfort, data-on-request]
description: >
  Head-to-head benchmark of four commercial passive back exoskeletons (two
  rigid, two soft) in Wearable Technologies (2024): 10 participants performed
  four workplace-simulated tasks; assistive moments, trunk muscle EMG, comfort
  and exertion were compared across devices. Data are not publicly deposited;
  available from the corresponding author on request. Link goes to the paper.
