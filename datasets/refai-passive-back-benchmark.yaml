tags: [exoskeleton, back, benchmark, passive-exoskeleton, comfort]
description: >
  Head-to-head benchmark of four commercial passive back exoskeletons (two
  rigid, two soft) in Wearable Technologies (2024): 10 participants performed
  four workplace-simulated tasks; assistive moments, trunk muscle EMG, comfort
  and exertion were compared across devices. The Zenodo deposit (CC BY 4.0)
  holds averaged 12-channel abdominal/back EMG for the dynamic tasks and
  static postures across all five conditions, plus comfort ratings (xlsx).
