description: >
  Forced-choice preference data from human-in-the-loop Bayesian optimization
  of two control parameters (lifting vs. lowering assistance gain) of an
  active soft back exosuit, from 15 participants, plus a supplementary
  just-noticeable-difference experiment on assistance perception (Science
  Advances, 2025). Behavioral/feedback data only, no raw biomechanical
  signals; CSV on Dryad under CC0.
