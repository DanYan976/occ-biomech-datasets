description: >
  NIOSH evaluation of the Laevo V2.5 passive back-support exoskeleton in
  bed-to-chair transfers (IJOSE, 2025): 8 participants performed
  lying-to-sitting, sitting-to-standing, standing-to-sitting and
  bed-to-wheelchair tasks with and without the device while trunk and hip
  angles, erector spinae EMG and heart rate were recorded. Public-domain
  NIOSH research dataset RD-1110-2025-0 on CDC STACKS.
