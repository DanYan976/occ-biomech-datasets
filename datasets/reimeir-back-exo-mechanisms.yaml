description: >
  Comparison of five back-support exoskeletons with different functional
  mechanisms (three passive, two active) in Wearable Technologies (2023):
  12 participants lifted, carried and lowered a 13 kg box while trunk muscle
  EMG and kinematics were recorded. Data are not publicly deposited; available
  from the corresponding author on request. Link goes to the paper.
