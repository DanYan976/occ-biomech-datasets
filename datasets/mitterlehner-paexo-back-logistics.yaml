id: mitterlehner-paexo-back-logistics
title: "Paexo Back Passive Exoskeleton in Simulated Logistics Workplaces"
status: restricted
sample: false

source:
  authors: "Mitterlehner L., Li Y.X., Wolf M."
  institution: "Graz University of Technology"
  year: 2023

access:
  url: "https://doi.org/10.1017/wtc.2023.19"
  doi: "10.1017/wtc.2023.19"
  license: "Data on request from the corresponding author"

tasks: [lifting, carrying, pushing, pulling, walking, mmh]
modalities: [imu, physiological]

subjects:
  n: 30
  sex: "8F / 22M"

exoskeleton:
  role: evaluation
  devices: ["Paexo Back (Ottobock)"]
  body_region: [back]
  actuation: [passive]
  comparison: "With vs. without the exoskeleton at three simulated logistics workplaces"
  outcomes: [cardiovascular, kinematics, task_performance, subjective]

load: "Three simulated logistics workplaces: deep-box unloading to an elevated table, order picking/storing with trolley, and pick-walk-store"
equipment: "Paexo Back (Ottobock) passive low-back exoskeleton; Zephyr Bioharness 3.0 (heart rate, trunk inclination/acceleration)"
sampling:
  imu: 100
  physiological: 1
tags: [exoskeleton, back, logistics, order-picking, acceptance, data-on-request]
description: >
  Objective and subjective evaluation of the Paexo Back passive low-back
  exoskeleton (Wearable Technologies, 2023): 30 participants worked at three
  simulated logistics workplaces; heart rate, trunk inclination/acceleration,
  throughput, exertion and acceptance were recorded. Data are not publicly
  deposited; available from the corresponding author on request. Link goes to
  the paper.
