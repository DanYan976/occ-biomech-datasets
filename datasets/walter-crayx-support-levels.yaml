  video: 30
tags: [exoskeleton, back, active-exoskeleton, lifting, support-levels, semg]
description: >
  Dose-response evaluation of the Cray X generation-4 active back
  exoskeleton: 14 participants stoop-lifted a 15 kg box at support levels
  from 0 to 100% in 10% steps plus a no-device condition while bilateral
  erector spinae EMG was recorded (Frontiers in Bioengineering and
  Biotechnology, 2023). Rare graded-assistance dataset; raw data available
  from the authors without undue reservation.
