id: lim-vt-mmh-ergo-risk
title: "Kinematic and EMG Dataset for Ergonomic Risk Assessment in Manual Material Handling"
status: open
sample: false

source:
  authors: "Lim S., Nussbaum M.A."
  institution: "Virginia Tech"
  country: [US]
  year: 2026

access:
  url: "https://doi.org/10.5281/zenodo.23669307"
  doi: "10.5281/zenodo.23669307"
  license: "CC-BY-4.0"

tasks: [lifting, lowering, pushing, pulling, mmh]
setting: lab
modalities: [imu, emg, depth]

subjects:
  n: 40
  sex: "20F / 20M"
  age_range: "Younger (mean 23 ± 3.1 y) and older (mean 55.5 ± 5.3 y) adults"

publications:
  - citation: "Taori S., Nussbaum M.A., Lim S. (2026). A Kinematic and Electromyographic Dataset for Ergonomic Risk Assessment in Manual Material Handling. Sci. Data"
    doi: "10.1038/s41597-026-08812-w"
    note: "Data descriptor: protocol, sensor setup, activity labels, missing-data tables and comparison with published MMH datasets"

load: "Horizontal box, vertical box and sandbag; 2.3, 4.5, 6.8, 9.1 and 11.3 kg; lifted from floor (0 m) or waist (0.90 m) to a cart, cart pushed/pulled 1.59 m, then lowered to shelves"
equipment: "Noraxon Ultium Motion IMUs (16 sensors, joint angles); 3 Microsoft Azure Kinect depth cameras (markerless skeleton); Mindrove 8-channel EMG armband on the right forearm (raw + MVC-normalized)"
sampling:
  imu: 200
  emg: 500
  depth: 30

formats: [csv]
tags: [ergonomics, older-workers, machine-learning, multimodal, sex-balanced, fatigue, activity-recognition]
description: >
  40 younger and older adults (20F/20M) each completed 12 trials of lifting,
  cart pushing/pulling and lowering with three load types and five masses,
  including fatigue trials at the start and end, recorded with IMUs, three Azure
  Kinects and an EMG armband (14.9 h in total). Every sample carries activity
  labels and trial conditions. Built for training and benchmarking ML
  ergonomic-risk models across age and sex.
